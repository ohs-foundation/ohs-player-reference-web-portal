services:
  hapi-fhir:
    image: hapiproject/hapi:latest
    ports:
      - '8080:8080'

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --http-port=8090
      - --hostname-strict=false
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    ports:
      - '8090:8090'
    volumes:
      - ./infra/keycloak/ohs-realm.json:/opt/keycloak/data/import/ohs-realm.json:ro

  ohs-info-gateway:
    # Set OHS_GATEWAY_IMAGE to your published OHS Info Gateway image; nginx is a dev-only FHIR proxy.
    image: ${OHS_GATEWAY_IMAGE:-nginx:alpine}
    ports:
      - '8180:8180'
    volumes:
      - ./infra/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - hapi-fhir

  ohs-player-web:
    # Build args set the FHIR and OIDC URLs baked into the SPA at build time.
    # Override via `--build-arg` or a .env file when deploying to non-default hosts.
    build:
      context: .
      dockerfile: apps/ohs-player-web/Dockerfile
      args:
        VITE_FHIR_BASE_URL: ${VITE_FHIR_BASE_URL:-http://localhost:8180/fhir}
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-http://localhost:8090/realms/ohs}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-ohs-player-web}
        VITE_FHIR_VERSION: ${VITE_FHIR_VERSION:-R4}
    ports:
      - '3000:80'
    depends_on:
      - keycloak
      - ohs-info-gateway
