server {
  listen 8180;
  server_name _;
  # Development reverse proxy: exposes a single base URL for the FHIR API behind a gateway-style port.
  # Replace this service with the published OHS Info Gateway image in production.

  location /fhir/ {
    proxy_pass http://hapi-fhir:8080/fhir/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /custom/ {
    return 501 '{"error":"Configure OHS_GATEWAY_IMAGE with transactional endpoints for /custom/*"}';
    add_header Content-Type application/json;
  }

  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
